<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Background structure grid lines -->
  <path d="M 10,90 L 90,90 M 10,10 L 10,90 M 90,10 L 90,90" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,3" fill="none" opacity="0.3"/>
  <!-- Stylized geometric N with construction crane/beam vibes -->
  <path d="M 20,80 L 20,20 L 45,55 L 45,80 L 20,80" fill="url(#brandGrad)"/>
  <path d="M 80,20 L 80,80 L 55,45 L 55,20 L 80,20" fill="url(#brandGrad)"/>
  <!-- Diagonal connection beam -->
  <path d="M 20,20 L 80,80 L 70,80 L 20,30 Z" fill="#fef08a" opacity="0.8"/>
  <!-- Architectural drafting grid circle -->
  <circle cx="50" cy="50" r="40" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,4" fill="none" opacity="0.5"/>
</svg>